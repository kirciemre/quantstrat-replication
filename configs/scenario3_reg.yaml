# Scenario 3, reg-DDPG/PPO (paper Section 3.3.3).
# Two-step: (1) OFFLINE GRU regressor predicts S~_{t+1} (MSE, last layer SiLU),
# frozen; (2) RL agent trains on G_t = (S_t, I_t, S~_{t+1}) -> state_dim = 3.
# eta/psi/ppo/gamma matched to the hid/prob configs so the three variants are
# directly comparable on the SAME backbone.

algorithm: reg-DDPG
scenario: 3

# --- OU / regime params ---
regimes: [0.9, 1.0, 1.1]
A: [[-0.1, 0.05, 0.05],
    [0.05, -0.1, 0.05],
    [0.05, 0.05, -0.1]]
regimes_kappa: [3.0, 7.0]
A_kappa: [[-0.1, 0.1], [0.1, -0.1]]
regimes_sigma: [0.1, 0.3]
A_sigma: [[-0.1, 0.1], [0.1, -0.1]]
dt: 0.2

# --- environment ---
W: 50               # reg window (paper table: W = 50 for reg)
I_max: 10
lam: 0.05
eta: 0.03           # matched to hid/prob (our extension)
psi: 0.0005         # matched to hid/prob
batch_size: 512

# --- GRU regressor dims (paper prob/reg table) ---
reg_hidden_dim: 20
reg_layers: 5
reg_ffn_layers: 5
reg_ffn_hidden: 64
reg_pretrain_steps: 10000

# --- policy (Actor/Critic) dims ---
d_NN: 64
l_NN: 5
action_dim: 1
enc_dim: 1          # unused by reg (state_dim=3 fixed); present for config.py

# --- DDPG ---
gamma: 0.999        # MATCH your hid/prob configs (change to 0.99 if hid used that)
tau: 0.001
lr: 0.001

# --- training ---
N: 10000
log_every: 500
l: 5
ell: 1

# --- PPO ---
ppo_updates: 300
ppo_lr: 0.0003

# --- exploration ---
eps_a: 100
eps_min: 0.01

# --- evaluation ---
n: 2000
M: 50

train_seed: null